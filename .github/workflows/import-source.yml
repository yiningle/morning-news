name: Import source

on:
  push:
    paths:
      - .github/workflows/import-source.yml
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Overlay the full source tree
        env:
          SRC_URL: https://tmpfiles.org/dl/1791546412.f5c85813cb458a69/wRAZgaQq0lIH/morning-news-src.tar.gz
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SRC_URL" -o /tmp/morning-news-src.tar.gz
          tar -tzf /tmp/morning-news-src.tar.gz >/dev/null
          tar -xzf /tmp/morning-news-src.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .probe.bin .github/workflows/import-source.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import the morning-news source"
          git push origin HEAD:main
